lor:#7995af;box-shadow:0 0 0 4px rgba(77,111,145,.1)}.meta{display:flex;justify-content:space-between;margin-top:7px;color:var(--muted);font-size:11px}.count{font-weight:800;color:var(--ok)}.count.bad{color:var(--bad)}.actions{display:grid;grid-template-columns:1.25fr .8fr 1fr;gap:8px;margin-top:11px}.btn{min-height:41px;border:1px solid transparent;border-radius:999px;font-size:12px;font-weight:800;cursor:pointer}.primary{background:linear-gradient(135deg,#1b2c45,#263d5d);color:#fff}.secondary{background:#fff;border-color:#bbc6d1;color:var(--navy)}.black{background:#111;color:#fff}.mobile{display:none}.checks{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:9px}.check{padding:6px;border-radius:9px;background:#eef7f2;color:#236346;font-size:9px;font-weight:800;text-align:center}.check.bad{background:#fff0f0;color:#a42832}.side-head{display:flex;align-items:center;justify-content:space-between}.side h2{margin:0;color:var(--navy);font-size:14px}.clear{border:0;border-radius:999px;background:var(--soft);padding:5px 9px;color:var(--blue);font-size:10px;font-weight:800}.history{display:grid;gap:6px;margin-top:10px;max-height:520px;overflow:auto}.hist{border:1px solid var(--line);border-radius:11px;background:#fff;padding:8px;text-align:left;cursor:pointer}.hist b{display:block;color:var(--blue);font-size:10px}.hist span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted);font-size:11px}.overlay{position:fixed;inset:0;z-index:100;display:none;justify-content:flex-end;background:rgba(9,18,31,.44);backdrop-filter:blur(5px)}.overlay.open{display:flex}.panel{width:min(585px,100%);height:100%;overflow:auto;background:#f7f8fa}.settings-top{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:17px 19px;background:#fff;border-bottom:1px solid var(--line)}.settings-top h2{margin:0;color:var(--navy);font-size:19px}.close{width:38px;height:38px;border:0;border-radius:999px;background:var(--soft);font-size:20px}.settings-body{padding:14px}.section{margin-bottom:12px;padding:16px;background:#fff;border:1px solid var(--line);border-radius:18px}.section h3{margin:0 0 4px;color:var(--navy);font-size:15px}.help{margin:0 0 12px;color:var(--muted);font-size:11px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.field{display:grid;gap:5px}.field.full{grid-column:1/-1}.field label{color:var(--navy);font-size:11px;font-weight:800}.field input,.field select,.field textarea{width:100%;border:1px solid #cbd3dc;border-radius:12px;padding:9px 11px;background:#fff}.field textarea{min-height:80px;resize:vertical}.switch{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-top:1px solid #edf0f3;font-size:12px}.switch input{width:20px;height:20px}.preview{margin-top:10px;padding:10px;border-radius:11px;background:#f3f6f8;color:#53616e;font-size:12px}.settings-actions{position:sticky;bottom:0;display:grid;grid-template-columns:.8fr 1.3fr;gap:9px;padding:12px 15px;background:#fff;border-top:1px solid var(--line)}.toast{position:fixed;left:50%;bottom:25px;z-index:200;transform:translate(-50%,15px);padding:10px 15px;border-radius:999px;background:#17212e;color:#fff;font-size:12px;opacity:0;transition:.18s}.toast.show{opacity:1;transform:translate(-50%,0)}

<header class="header"><div class="inner header-in"><div class="brand">PLATINUM<small>SOCIAL POST STUDIO</small></div><button id="settingsOpen" class="gear">⚙️ 設定</button></div></header>
<main class="inner"><div class="hero"><h1>投稿の種類を選んで文章を作成</h1><p>自然な日本語・要相談対応・X文字数検証</p></div><div class="layout"><section class="card"><div class="body"><span class="label">投稿の種類</span><div class="modes"><button class="mode active" data-mode="simple">📨 シンプル募集</button><button class="mode" data-mode="battle">🏆 内戦後</button><button class="mode" data-mode="play">🎮 通常遊び後</button><button class="mode" data-mode="morning">🌅 おはツイ</button><button class="mode" data-mode="night">🌙 夜ツイ</button><button class="mode" data-mode="chat">💬 雑談系</button><button class="mode" data-mode="thanks">🙏 感謝系</button></div><span class="label">投稿内容</span><textarea id="editor" class="editor"></textarea><div class="meta"><span>自動保存</span><span id="counter" class="count"></span></div><div class="actions"><button id="generate" class="btn primary">同じ種類でもう一度作る</button><button id="copy" class="btn secondary">コピー</button><button id="post" class="btn black desktop">Xで投稿</button><button id="app" class="btn black mobile app">Xアプリを開く</button><button id="web" class="btn secondary mobile">Xのサイトを開く</button></div><div id="checks" class="checks"></div></div></section><aside class="card side"><div class="body"><div class="side-head"><h2>生成履歴</h2><button id="clear" class="clear">削除</button></div><div id="history" class="history"></div></div></aside></div></main>
<div id="settings" class="overlay"><section class="panel"><div class="settings-top"><h2>投稿設定</h2><button id="settingsClose" class="close">×</button></div><div class="settings-body"><section class="section"><h3>基本設定</h3><p class="help">軍団名・募集条件・要相談の境界を変更できます。</p><div class="grid"><div class="field"><label>軍団名</label><input id="clan"></div><div class="field"><label>募集する流行値</label><input id="value" type="number" inputmode="numeric"></div><div class="field"><label>「○○以下は要相談」の数値</label><input id="consultValue" type="number" inputmode="numeric"></div><div class="field"><label>文章の長さ</label><select id="length"><option value="short">短め</option><option value="standard">標準</option><option value="long">しっかり</option></select></div></div></section><section class="section"><h3>要相談</h3><label class="switch"><span>要相談文を入れる</span><input id="consultOn" type="checkbox"></label><div class="field"><label>要相談文のタイプ</label><select id="consultType"><option value="auto">自然におまかせ</option><option value="direct">はっきり</option><option value="soft">やわらかめ</option><option value="polite">丁寧</option><option value="dm">DM誘導</option><option value="custom">自分で入力</option></select></div><div class="field" style="margin-top:10px"><label>自分で入力する要相談文</label><input id="consultCustom" placeholder="例：6000以下の方は要相談です"></div><div id="consultPreview" class="preview"></div></section><section class="section"><h3>投稿内容</h3><label class="switch"><span>流行値条件を入れる</span><input id="incCondition" type="checkbox"></label><label class="switch"><span>「流行値高い方」を入れる</span><input id="incHigh" type="checkbox"></label><label class="switch"><span>DM案内を入れる</span><input id="incDm" type="checkbox"></label><label class="switch"><span>ハッシュタグを入れる</span><input id="incTags" type="checkbox"></label></section><section class="section"><h3>言葉の設定</h3><div class="grid"><div class="field"><label>必ず入れる言葉（1行1つ）</label><textarea id="required"></textarea></div><div class="field"><label>使用しない言葉（1行1つ）</label><textarea id="banned"></textarea></div></div></section></div><div class="settings-actions"><button id="reset" class="btn secondary">初期設定</button><button id="save" class="btn primary">保存して生成</button></div></section></div><div id="toast" class="toast"></div>
<script>
'use strict';
const $=id=>document.getElementById(id),MAX=280,K={settings:'platinum.fixed.settings',history:'platinum.fixed.history',current:'platinum.fixed.current',mode:'platinum.fixed.mode',used:'platinum.fixed.used'};
const defaults={clan:'PLATINUM',value:'6000',consultValue:'6000',consultOn:true,consultType:'auto',consultCustom:'',length:'standard',incCondition:true,incHigh:true,incDm:true,incTags:true,required:'',banned:'高流行値\n初心者歓迎\n交流重視\n枠空いてます\n空き枠\n即入隊\n誰でも歓迎'};
let settings=Object.assign({},defaults,read(K.settings,{})),history=read(K.history,[]),used=read(K.used,{}),mode=localStorage.getItem(K.mode)||'simple',timer;
const DATA={
simple:{name:'シンプル募集',lead:['流行値軍団PLATINUMです！💎','流行値軍団のPLATINUMでメンバー募集してます！','軍団名はPLATINUMです！','PLATINUMという流行値軍団で活動してます！','流行値軍団PLATINUMから募集です📨','PLATINUMで一緒に頑張ってくれる方を探してます！'],body:['軍団全体でもっと上を目指したいので、新しいメンバーを探してます。','これからも流行値を伸ばしていきたいと思ってます。','同じ目標で頑張れる方に来てもらえたら嬉しいです。','PLATINUMをもっと盛り上げていきたいと思ってます。']},
battle:{name:'内戦後',lead:['今日の内戦に参加してくれた皆さん、ありがとうございました🏆','内戦お疲れさまでした！今回も楽しかったです🔥','月1の内戦、今回もありがとうございました🙌','今日の内戦も最後まで盛り上がりました！'],body:['いい試合が多くて、見ていても楽しかったです。','参加してくれた皆さんのおかげで、今回も楽しい内戦になりました。','次回もみんなで楽しめる内戦にしたいです。','今回もPLATINUMらしい内戦になりました。']},
play:{name:'通常遊び後',lead:['今日も一緒に遊んでくれて、ありがとうございました🎮','今日遊んでくれた皆さん、ありがとうございました！','今日も荒野を一緒に回れて楽しかったです🙌','一緒に遊んでくれた皆さん、お疲れさまでした！'],body:['またタイミングが合う時に遊びましょう👀','今日も最後まで楽しく遊べてよかったです。','いい試合も多くて、充実した時間になりました。','また時間が合う時に、みんなで遊びたいです。']},
morning:{name:'おはツイ',lead:['おはようございます☀️ 今日もよろしくお願いします！','おはようございます！今日も1日頑張りましょう🙌','おはようございます🌅 今日も無理せずいきましょう！','おはようございます！いい1日になりますように✨','おはようございます☀️ 朝から募集です！','おはようございます！今日も荒野を楽しみましょう🎮'],body:['今日も流行値軍団PLATINUMをよろしくお願いします。','朝から見つけてくれた方、ありがとうございます。','今日もPLATINUMで一緒に頑張ってくれる方を探してます。','今日もいい出会いがあったら嬉しいです。','本日もPLATINUMでメンバーを募集してます。','朝のうちに、PLATINUMの募集を置いておきます。']},
night:{name:'夜ツイ',lead:['こんばんは🌙 今日も1日お疲れさまでした！','夜ツイです🌙 今日もお疲れさまです！','こんばんは！今日もありがとうございました✨','今日も1日お疲れさまでした。寝る前に少し募集です😴','こんばんは🌙 遅い時間までお疲れさまです！'],body:['夜に荒野をする方にも届いたら嬉しいです。','この時間に見つけてくれた方、ありがとうございます。','今日も流行値軍団PLATINUMでメンバーを探してます。','寝る前に、PLATINUMの募集を置いておきます。','明日もPLATINUMをよろしくお願いします。']},
chat:{name:'雑談系',lead:['そういえば、最近また荒野のモチベが上がってます🔥','ふと思ったんですが、流行値高い方ってどこにいるんでしょう👀','最近、もっと上を目指したい気持ちが強くなってます。','今日は少しだけ、PLATINUMの話をさせてください💬','最近、流行値を見るのがちょっと楽しみになってます。'],body:['せっかくなら、流行値高い方ともっとつながりたいです。','PLATINUMを今よりもっといい軍団にしていきたいと思ってます。','軍団を探してる方に、この投稿が届いたら嬉しいです。','同じように流行値を頑張ってる方と話してみたいです。']},
thanks:{name:'感謝系',lead:['いつもPLATINUMに関わってくれる皆さん、ありがとうございます🙏','いつも投稿を見てくれて、ありがとうございます！','普段から一緒に活動してくれる皆さんに感謝です✨','最近たくさん反応をもらえて、本当に嬉しいです。'],body:['皆さんのおかげで、PLATINUMも少しずつ成長できてます。','これからも、みんなでさらに上を目指していきたいです。','これからも流行値軍団PLATINUMをよろしくお願いします。','今後も、もっといい軍団にしていきたいと思ってます。']}};
const RECRUIT=['流行値6000以上で、軍団を探してる方いませんか？','流行値6000以上の方を募集してます！','流行値6000以上の方がいたら、ぜひ声をかけてください👀','流行値6000以上で移籍先を探してる方、PLATINUMも候補に入れてください！','流行値6000以上の方に来てもらえたら嬉しいです🙌'];
const HIGH=['流行値高い方、ぜひPLATINUMに来てください🤝','流行値高い方と一緒に、もっと上を目指したいです🔥','流行値高い方に来てもらえたら心強いです🙌','流行値高い方を中心に探してます👀'];
const DM=['少しでも気になった方は、気軽にDMください📩','興味のある方はDMお願いします📩','質問だけでも大丈夫なので、DMお待ちしてます📩','詳しく知りたい方は、気軽にDMしてください📩'];
const TAGS=['#荒野行動 #流行値軍団','#荒野行動 #軍団募集','#荒野行動 #PLATINUM','#荒野行動 #流行値軍団 #軍団募集'];
const CONSULT={direct:['6000以下の方は要相談です。','6000以下の方は一度ご相談ください。'],soft:['6000以下の方も、まずは気軽にご相談ください。','条件に少し届かない方も、一度ご相談ください。'],polite:['6000以下の方は、事前にご相談をお願いします。','条件に届かない方も、よろしければ一度ご相談ください。'],dm:['6000以下の方はDMでご相談ください。','6000以下でも気になる方は、まずDMをお願いします。']};
function read(k,f){try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}}
function fresh(k,a){let u=used[k]||[],ids=a.map((_,i)=>i).filter(i=>!u.includes(i));if(!ids.length){u=[];ids=a.map((_,i)=>i)}const i=ids[Math.floor(Math.random()*ids.length)];used[k]=[...u,i];localStorage.setItem(K.used,JSON.stringify(used));return a[i]}
function parseX(t){const l=window.twitterText;if(l?.parseTweet)return l.parseTweet(t);let n=0;for(const c of t)n+=c.codePointAt(0)<=127?1:2;return{weightedLength:n,valid:n<=MAX}}
function words(v){return String(v||'').split(/\n+/).map(x=>x.trim()).filter(Boolean)}
function consultLine(){if(!settings.consultOn)return'';if(settings.consultType==='custom'&&settings.consultCustom.trim())return settings.consultCustom.replaceAll('{数値}',settings.consultValue);const type=settings.consultType==='auto'?['direct','soft','polite','dm'][Math.floor(Math.random()*4)]:settings.consultType;return fresh('consult.'+type,CONSULT[type]).replaceAll('6000',settings.consultValue)}
function transform(t){return t.replaceAll('PLATINUM',settings.clan).replaceAll('6000',settings.value).replace(/\n{3,}/g,'\n\n').trim()}
function limit(){return settings.length==='short'?170:settings.length==='long'?270:240}
function valid(t){const x=parseX(t);return x.valid&&x.weightedLength<=limit()&&!words(settings.banned).some(w=>t.includes(w))&&!words(settings.required).some(w=>!t.includes(w))}
function make(){
  const d=DATA[mode];
  const lead=fresh(mode+'.lead',d.lead);
  const body=fresh(mode+'.body',d.body);
  const recruit=settings.incCondition?fresh(mode+'.rec',RECRUIT):'';
  const high=settings.incHigh?fresh(mode+'.high',HIGH):'';
  const consult=consultLine();
  const dm=settings.incDm?fresh(mode+'.dm',DM):'';
  const tag=settings.incTags?fresh(mode+'.tag',TAGS):'';

  // モード固有の導入は必ず残し、長さに合わせて補助文だけ減らす。
  const patterns=settings.length==='short'
    ? [[lead,recruit,consult,dm,tag],[lead,consult,dm,tag],[lead,dm,tag]]
    : settings.length==='long'
      ? [[lead,body,recruit,high,consult,dm,tag],[lead,body,recruit,consult,dm,tag],[lead,recruit,high,consult,dm,tag],[lead,recruit,consult,dm,tag]]
      : [[lead,body,recruit,consult,dm,tag],[lead,recruit,high,consult,dm,tag],[lead,recruit,consult,dm,tag],[lead,body,consult,dm,tag]];

  for(const parts of patterns){
    const text=transform(parts.filter(Boolean).join('\n\n'));
    if(valid(text))return text;
  }

  // 必須語の設定などで通常候補が通らない場合も、選択したモードの文を維持する。
  const modeFallback=transform([lead,recruit,consult,dm,tag].filter(Boolean).join('\n\n'));
  const mx=parseX(modeFallback);
  if(mx.valid&&mx.weightedLength<=MAX)return modeFallback;

  const compact=transform([lead,consult,dm,tag].filter(Boolean).join('\n\n'));
  const cx=parseX(compact);
  if(cx.valid&&cx.weightedLength<=MAX)return compact;

  // 最終保証でもモード固有の先頭文を残す。
  return transform([lead,dm||'気になった方はDMください📩',tag||'#荒野行動'].join('\n\n'));
}function generate(show=true){$('editor').value=make();saveCurrent();addHistory();status();if(show)toast(DATA[mode].name+'を作成しました')}
function saveCurrent(){localStorage.setItem(K.current,$('editor').value)}
function addHistory(){if(history[0]?.text===$('editor').value)return;history.unshift({text:$('editor').value,mode});history=history.slice(0,40);localStorage.setItem(K.history,JSON.stringify(history));renderHistory()}
function status(){const x=parseX($('editor').value),n=x.weightedLength;$('counter').textContent=`X換算 ${n} / 280（残り ${Math.max(0,280-n)}）`;$('counter').className='count'+(n>280?' bad':'');$('checks').innerHTML=`<div class="check${n<=limit()?'':' bad'}">${n<=limit()?'✓':'!'} ${limit()}以内</div><div class="check">✓ モード別文章</div><div class="check${x.valid?'':' bad'}">${x.valid?'✓':'!'} 投稿可能</div>`;['post','app','web'].forEach(id=>$(id).disabled=!x.valid)}
function renderHistory(){const b=$('history');b.innerHTML='';history.slice(0,10).forEach(h=>{const e=document.createElement('button');e.className='hist';e.innerHTML=`<b>${DATA[h.mode]?.name||'投稿'}</b><span></span>`;e.querySelector('span').textContent=h.text.replace(/\n/g,' ');e.onclick=()=>{$('editor').value=h.text;saveCurrent();status()};b.appendChild(e)})}
function toast(m){$('toast').textContent=m;$('toast').classList.add('show');clearTimeout(timer);timer=setTimeout(()=>$('toast').classList.remove('show'),1600)}
function openSettings(){$('clan').value=settings.clan;$('value').value=settings.value;$('consultValue').value=settings.consultValue;$('consultOn').checked=settings.consultOn;$('consultType').value=settings.consultType;$('consultCustom').value=settings.consultCustom;$('length').value=settings.length;$('incCondition').checked=settings.incCondition;$('incHigh').checked=settings.incHigh;$('incDm').checked=settings.incDm;$('incTags').checked=settings.incTags;$('required').value=settings.required;$('banned').value=settings.banned;preview();$('settings').classList.add('open');document.body.style.overflow='hidden'}
function closeSettings(){$('settings').classList.remove('open');document.body.style.overflow=''}
function preview(){$('consultPreview').textContent='表示例：'+(consultLine()||'要相談文は表示しません')}
function sendToX(){const t=$('editor').value.trim(),x=parseX(t);if(!t||!x.valid){toast('文字数を確認してください');return}generate(false);location.href='https://x.com/intent/post?text='+encodeURIComponent(t)}
document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;localStorage.setItem(K.mode,mode);document.querySelectorAll('.mode').forEach(x=>x.classList.toggle('active',x===b));generate()});
$('settingsOpen').onclick=openSettings;$('settingsClose').onclick=closeSettings;$('settings').onclick=e=>{if(e.target===$('settings'))closeSettings()};$('consultType').onchange=$('consultValue').oninput=$('consultCustom').oninput=$('consultOn').onchange=preview;
$('save').onclick=()=>{settings={clan:$('clan').value.trim()||'PLATINUM',value:$('value').value.replace(/\D/g,'')||'6000',consultValue:$('consultValue').value.replace(/\D/g,'')||$('value').value,consultOn:$('consultOn').checked,consultType:$('consultType').value,consultCustom:$('consultCustom').value,length:$('length').value,incCondition:$('incCondition').checked,incHigh:$('incHigh').checked,incDm:$('incDm').checked,incTags:$('incTags').checked,required:$('required').value,banned:$('banned').value};localStorage.setItem(K.settings,JSON.stringify(settings));closeSettings();generate()};
$('reset').onclick=()=>{localStorage.removeItem(K.settings);location.reload()};$('generate').onclick=()=>generate();$('copy').onclick=async()=>{await navigator.clipboard.writeText($('editor').value);toast('コピーしました')};$('post').onclick=$('web').onclick=sendToX;$('app').onclick=()=>{const t=$('editor').value.trim();generate(false);location.href='twitter://post?message='+encodeURIComponent(t)};$('clear').onclick=()=>{history=[];localStorage.removeItem(K.history);renderHistory()};$('editor').oninput=()=>{saveCurrent();status()};
(function(){document.querySelectorAll('.mode').forEach(x=>x.classList.toggle('active',x.dataset.mode===mode));renderHistory();const saved=localStorage.getItem(K.current);if(saved){$('editor').value=saved;status()}else generate(false)})();
</script></body></html>
